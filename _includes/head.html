<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#10151b">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  {% if page.sitemap == false %}<meta name="robots" content="noindex">{% endif %}
  {% if page.seo_title %}
  <title>{{ page.seo_title | escape }} | {{ site.title | escape }}</title>
  {% seo title=false %}
  {% else %}
  {% seo %}
  {% endif %}
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% if page.layout == 'clickfix' %}<link rel="stylesheet" href="{{ '/css/clickfix.css' | relative_url }}?v={{ site.time | date: '%s' }}">{% endif %}
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }} RSS" href="{{ '/atom.xml' | relative_url }}">
</head>
