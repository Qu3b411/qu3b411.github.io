---
layout: default
---
<article class="prose post-content">
  <header class="page-heading">
    <p class="eyebrow">Research note</p>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}" class="post-date">{{ page.date | date: '%d %b %Y' }}</time>
  </header>
  {{ content }}
</article>
